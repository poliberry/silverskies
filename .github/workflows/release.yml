name: Release

# Every push to main builds real installers of both apps — Silver Skies and
# Silver Skies Pro — for all three platforms and publishes them together as
# a new GitHub Release, tagged v<workspace version>.<build> (for example
# v2.0.2.1) and noted with every commit since the previous release. Builds
# count from 1 for each workspace version: bump `version` in Cargo.toml and
# the next push is build 1 of the new version. No tag needs to be pushed:
# the release job creates it at the pushed commit.
# `workflow_dispatch` builds the same matrix and uploads the installers as
# workflow artifacts only, so the pipeline can be tested without releasing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, in push order; a newer push never cancels an older
# one mid-publish.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  # Work out the version and the next build number once, for every job.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version *= *"\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          # Highest existing build of this version (tags v<version>.<n>), plus one.
          LAST="$(git tag --list "v${VERSION}.*" \
            | sed -n "s/^v${VERSION//./\\.}\.\([0-9][0-9]*\)$/\1/p" \
            | sort -n | tail -n 1)"
          BUILD=$(( ${LAST:-0} + 1 ))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}.${BUILD}" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION, build $BUILD"

  build:
    needs: version
    name: build (${{ matrix.app.name }}, ${{ matrix.platform.asset_key }})
    strategy:
      fail-fast: false
      matrix:
        # Every app is built for every platform.
        app:
          - name: Silver Skies
            dir: apps/silverskies
            package: silverskies
            bin: silverskies
            file: SilverSkies
            deb_desc: Calm weather forecast with search, summaries, radar and alerts
          - name: Silver Skies Pro
            dir: apps/pro
            package: silverskies-pro
            bin: silverskies-pro
            file: SilverSkiesPro
            deb_desc: Composite forecast, meteorology and radar workstation
        platform:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_key: windows
            exe: ".exe"
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_key: macos-arm64
            dmg_arch: arm64
          # Both macOS architectures build on the same (Apple Silicon)
          # runner: rustup cross-targets x86_64 with no extra setup, which
          # avoids depending on the retired Intel-only macos-13 image.
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_key: macos-x86_64
            dmg_arch: x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_key: linux
    runs-on: ${{ matrix.platform.os }}
    env:
      APP_NAME: ${{ matrix.app.name }}
      APP_DIR: ${{ matrix.app.dir }}
      APP_BIN: ${{ matrix.app.bin }}
      APP_FILE: ${{ matrix.app.file }}
      TARGET: ${{ matrix.platform.target }}
      VERSION: ${{ needs.version.outputs.version }}
      # Compiled into the apps (shown in About as "2.0.2 (build 1)").
      SS_BUILD: ${{ needs.version.outputs.build }}
      # Version as it appears in installer and package names: 2.0.2.1.
      FULL_VERSION: ${{ needs.version.outputs.version }}.${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.app.package }}

      # eframe (glow/winit) and rodio/tts need these system libraries on Linux.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libgtk-3-dev libasound2-dev \
            libspeechd-dev libssl-dev pkg-config

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.platform.target }} -p ${{ matrix.app.package }}

      # --- Windows: portable zip + Inno Setup installer ---------------------
      - name: Package portable zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item "target/$env:TARGET/release/$env:APP_BIN.exe" stage/
          Copy-Item "$env:APP_DIR/README.md" stage/
          Compress-Archive -Path stage/* -DestinationPath "$env:APP_FILE-$env:FULL_VERSION-windows-x86_64.zip"

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$env:FULL_VERSION /O"$PWD" /F"$env:APP_FILE-Setup-$env:FULL_VERSION" "$env:APP_DIR\dist\windows\installer.iss"

      # --- macOS: .app bundle, .dmg and .zip --------------------------------
      - name: Package app bundle and disk image (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP="build/$APP_NAME.app"
          ICON="$APP_DIR/assets/icon-dark.png"
          rm -rf "$APP" AppIcon.iconset
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" AppIcon.iconset
          cp "target/$TARGET/release/$APP_BIN" "$APP/Contents/MacOS/$APP_BIN"
          cp "$APP_DIR/dist/macos/Info.plist" "$APP/Contents/Info.plist"
          chmod +x "$APP/Contents/MacOS/$APP_BIN"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $SS_BUILD" "$APP/Contents/Info.plist"
          # Icon set from the 512px source (no 1024px @2x available).
          for spec in 16:16x16 32:16x16@2x 32:32x32 64:32x32@2x 128:128x128 256:128x128@2x 256:256x256 512:256x256@2x 512:512x512; do
            px="${spec%%:*}"; name="${spec#*:}"
            sips -z "$px" "$px" "$ICON" --out "AppIcon.iconset/icon_${name}.png" >/dev/null
          done
          iconutil -c icns AppIcon.iconset -o "$APP/Contents/Resources/AppIcon.icns"
          DMG="$APP_FILE-${FULL_VERSION}-macos-${{ matrix.platform.dmg_arch }}.dmg"
          ZIP="$APP_FILE-${FULL_VERSION}-macos-${{ matrix.platform.dmg_arch }}.zip"
          hdiutil create -volname "$APP_NAME" -srcfolder "$APP" -ov -format UDZO "$DMG"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"

      # --- Linux: AppImage + .deb --------------------------------------------
      - name: Build AppImage and .deb (Linux)
        if: runner.os == 'Linux'
        env:
          DEB_DESC: ${{ matrix.app.deb_desc }}
        run: |
          set -euo pipefail
          BIN="target/$TARGET/release/$APP_BIN"
          DESKTOP="$APP_DIR/dist/linux/$APP_BIN.desktop"
          mkdir -p stage AppDir
          cp "$APP_DIR/assets/icon-dark.png" "stage/$APP_BIN.png"
          # linuxdeploy has no FUSE on these runners: extract and run AppRun directly.
          echo "Downloading linuxdeploy..."
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy.AppImage
          echo "Downloading linuxdeploy appimage plugin..."
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage -O linuxdeploy-plugin-appimage.AppImage
          chmod +x linuxdeploy*.AppImage
          ./linuxdeploy.AppImage --appimage-extract >/dev/null && mv squashfs-root ld-root
          ./linuxdeploy-plugin-appimage.AppImage --appimage-extract >/dev/null && mv squashfs-root ld-plugin-root
          export PATH="$PWD/ld-plugin-root/usr/bin:$PATH"
          VERSION="$FULL_VERSION" ./ld-root/AppRun --appdir AppDir \
            -e "$BIN" -d "$DESKTOP" -i "stage/$APP_BIN.png" \
            --output appimage
          BUILT="$(ls ./*.AppImage | grep -vi linuxdeploy | head -n 1)"
          mv "$BUILT" "$APP_FILE-${FULL_VERSION}-x86_64.AppImage"
          # Hand-rolled .deb (no extra tooling needed on the runner).
          PKG=deb-root
          mkdir -p "$PKG/DEBIAN" "$PKG/usr/bin" "$PKG/usr/share/applications" \
            "$PKG/usr/share/icons/hicolor/512x512/apps"
          cp "$BIN" "$PKG/usr/bin/$APP_BIN"
          cp "$DESKTOP" "$PKG/usr/share/applications/"
          cp "$APP_DIR/assets/icon-dark.png" "$PKG/usr/share/icons/hicolor/512x512/apps/$APP_BIN.png"
          cat > "$PKG/DEBIAN/control" <<EOF
          Package: $APP_BIN
          Version: ${VERSION}-${SS_BUILD}
          Architecture: amd64
          Maintainer: Silver Skies <e993372@staff.poliberry.com>
          Description: $DEB_DESC
           $APP_NAME, part of the Silver Skies suite of weather apps.
          EOF
          dpkg-deb --build "$PKG" "${APP_BIN}_${VERSION}-${SS_BUILD}_amd64.deb"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.app.package }}-${{ matrix.platform.asset_key }}
          path: |
            ${{ matrix.app.file }}-*.exe
            ${{ matrix.app.file }}-*.zip
            ${{ matrix.app.file }}-*.dmg
            ${{ matrix.app.file }}-*.AppImage
            ${{ matrix.app.bin }}_*.deb
          if-no-files-found: error

  release:
    # Pushes to main publish a GitHub Release; manual dispatches stop at the
    # downloadable workflow artifacts above.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: 'release-*'
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release with changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.build }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          TITLE="Silver Skies & Silver Skies Pro ${VERSION} (build ${BUILD})"
          # Previous release: the highest existing v* tag other than this one.
          PREV="$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG" | head -n 1 || true)"
          if [[ -n "$PREV" ]]; then
            RANGE="$PREV..$GITHUB_SHA"
          else
            RANGE="$GITHUB_SHA"
          fi
          COMMITS="$(git log "$RANGE" --no-merges -n 200 --pretty=format:'- %s (%h, %an)')"
          COUNT="$(git rev-list --no-merges --count "$RANGE")"
          {
            echo "## $TITLE"
            echo ""
            echo "Built from ${GITHUB_SHA::7} on main. Installers for Windows (setup + portable"
            echo "zip), macOS (Apple silicon and Intel .dmg/.zip) and Linux (AppImage + .deb)."
            echo ""
            echo "### Changes since ${PREV:-the beginning} ($COUNT commits)"
            echo ""
            echo "${COMMITS:-- No code changes.}"
          } > notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            # A re-run of this workflow: refresh the notes and assets.
            gh release edit "$TAG" --title "$TITLE" --notes-file notes.md --draft=false
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --target "$GITHUB_SHA" --title "$TITLE" --notes-file notes.md --latest
          fi
          echo "Published ${TAG} with $(ls release-assets | wc -l) assets."
