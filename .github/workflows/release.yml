name: Release

# Push a tag matching v* (keep it in sync with the workspace version in
# Cargo.toml) to build real installers of both apps — Silver Skies and
# Silver Skies Pro — for all three platforms and publish
# (or update) the GitHub Release for that tag, with notes generated from
# every commit since the previous release. `workflow_dispatch` builds the
# same matrix and uploads the installers as workflow artifacts instead, so
# the pipeline can be tested without cutting a release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.app.name }}, ${{ matrix.platform.asset_key }})
    strategy:
      fail-fast: false
      matrix:
        # Every app is built for every platform.
        app:
          - name: Silver Skies
            dir: apps/silverskies
            package: silverskies
            bin: silverskies
            file: SilverSkies
            deb_desc: Calm weather forecast with search, summaries, radar and alerts
          - name: Silver Skies Pro
            dir: apps/pro
            package: silverskies-pro
            bin: silverskies-pro
            file: SilverSkiesPro
            deb_desc: Composite forecast, meteorology and radar workstation
        platform:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_key: windows
            exe: ".exe"
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_key: macos-arm64
            dmg_arch: arm64
          # Both macOS architectures build on the same (Apple Silicon)
          # runner: rustup cross-targets x86_64 with no extra setup, which
          # avoids depending on the retired Intel-only macos-13 image.
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_key: macos-x86_64
            dmg_arch: x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_key: linux
    runs-on: ${{ matrix.platform.os }}
    env:
      APP_NAME: ${{ matrix.app.name }}
      APP_DIR: ${{ matrix.app.dir }}
      APP_BIN: ${{ matrix.app.bin }}
      APP_FILE: ${{ matrix.app.file }}
      TARGET: ${{ matrix.platform.target }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.app.package }}

      # eframe (glow/winit) and rodio/tts need these system libraries on Linux.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libgtk-3-dev libasound2-dev \
            libspeechd-dev libssl-dev pkg-config

      - name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version *= *"\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Release version: $VERSION"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "v$VERSION" ]]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version v$VERSION"
              exit 1
            fi
          fi

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.platform.target }} -p ${{ matrix.app.package }}

      # --- Windows: portable zip + Inno Setup installer ---------------------
      - name: Package portable zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item "target/$env:TARGET/release/$env:APP_BIN.exe" stage/
          Copy-Item "$env:APP_DIR/README.md" stage/
          Compress-Archive -Path stage/* -DestinationPath "$env:APP_FILE-$env:VERSION-windows-x86_64.zip"

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$env:VERSION /O"$PWD" /F"$env:APP_FILE-Setup-$env:VERSION" "$env:APP_DIR\dist\windows\installer.iss"

      # --- macOS: .app bundle, .dmg and .zip --------------------------------
      - name: Package app bundle and disk image (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP="build/$APP_NAME.app"
          ICON="$APP_DIR/assets/icon-dark.png"
          rm -rf "$APP" AppIcon.iconset
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" AppIcon.iconset
          cp "target/$TARGET/release/$APP_BIN" "$APP/Contents/MacOS/$APP_BIN"
          cp "$APP_DIR/dist/macos/Info.plist" "$APP/Contents/Info.plist"
          chmod +x "$APP/Contents/MacOS/$APP_BIN"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" "$APP/Contents/Info.plist"
          # Icon set from the 512px source (no 1024px @2x available).
          for spec in 16:16x16 32:16x16@2x 32:32x32 64:32x32@2x 128:128x128 256:128x128@2x 256:256x256 512:256x256@2x 512:512x512; do
            px="${spec%%:*}"; name="${spec#*:}"
            sips -z "$px" "$px" "$ICON" --out "AppIcon.iconset/icon_${name}.png" >/dev/null
          done
          iconutil -c icns AppIcon.iconset -o "$APP/Contents/Resources/AppIcon.icns"
          DMG="$APP_FILE-${VERSION}-macos-${{ matrix.platform.dmg_arch }}.dmg"
          ZIP="$APP_FILE-${VERSION}-macos-${{ matrix.platform.dmg_arch }}.zip"
          hdiutil create -volname "$APP_NAME" -srcfolder "$APP" -ov -format UDZO "$DMG"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"

      # --- Linux: AppImage + .deb --------------------------------------------
      - name: Build AppImage and .deb (Linux)
        if: runner.os == 'Linux'
        env:
          DEB_DESC: ${{ matrix.app.deb_desc }}
        run: |
          set -euo pipefail
          BIN="target/$TARGET/release/$APP_BIN"
          DESKTOP="$APP_DIR/dist/linux/$APP_BIN.desktop"
          mkdir -p stage AppDir
          cp "$APP_DIR/assets/icon-dark.png" "stage/$APP_BIN.png"
          # linuxdeploy has no FUSE on these runners: extract and run AppRun directly.
          echo "Downloading linuxdeploy..."
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy.AppImage
          echo "Downloading linuxdeploy appimage plugin..."
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage -O linuxdeploy-plugin-appimage.AppImage
          chmod +x linuxdeploy*.AppImage
          ./linuxdeploy.AppImage --appimage-extract >/dev/null && mv squashfs-root ld-root
          ./linuxdeploy-plugin-appimage.AppImage --appimage-extract >/dev/null && mv squashfs-root ld-plugin-root
          export PATH="$PWD/ld-plugin-root/usr/bin:$PATH"
          VERSION="$VERSION" ./ld-root/AppRun --appdir AppDir \
            -e "$BIN" -d "$DESKTOP" -i "stage/$APP_BIN.png" \
            --output appimage
          BUILT="$(ls ./*.AppImage | grep -vi linuxdeploy | head -n 1)"
          mv "$BUILT" "$APP_FILE-${VERSION}-x86_64.AppImage"
          # Hand-rolled .deb (no extra tooling needed on the runner).
          PKG=deb-root
          mkdir -p "$PKG/DEBIAN" "$PKG/usr/bin" "$PKG/usr/share/applications" \
            "$PKG/usr/share/icons/hicolor/512x512/apps"
          cp "$BIN" "$PKG/usr/bin/$APP_BIN"
          cp "$DESKTOP" "$PKG/usr/share/applications/"
          cp "$APP_DIR/assets/icon-dark.png" "$PKG/usr/share/icons/hicolor/512x512/apps/$APP_BIN.png"
          cat > "$PKG/DEBIAN/control" <<EOF
          Package: $APP_BIN
          Version: $VERSION
          Architecture: amd64
          Maintainer: Silver Skies <e993372@staff.poliberry.com>
          Description: $DEB_DESC
           $APP_NAME, part of the Silver Skies suite of weather apps.
          EOF
          dpkg-deb --build "$PKG" "${APP_BIN}_${VERSION}_amd64.deb"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.app.package }}-${{ matrix.platform.asset_key }}
          path: |
            ${{ matrix.app.file }}-*.exe
            ${{ matrix.app.file }}-*.zip
            ${{ matrix.app.file }}-*.dmg
            ${{ matrix.app.file }}-*.AppImage
            ${{ matrix.app.bin }}_*.deb
          if-no-files-found: error

  release:
    # Only tag pushes publish to GitHub Releases; manual dispatches stop at
    # the downloadable workflow artifacts above.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: 'release-*'
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release with changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          # Previous release tag (highest version below this one).
          PREV="$(git tag --list 'v*' --sort=-v:refname | grep -v "^${TAG}$" | head -n 1 || true)"
          if [[ -n "$PREV" ]]; then
            RANGE="$PREV..$TAG"
            COMMITS="$(git log "$RANGE" --pretty=format:'- %s (%h, %an)' | head -n 200)"
            COUNT="$(git rev-list --count "$RANGE")"
          else
            RANGE="$TAG"
            COMMITS="$(git log "$TAG" --pretty=format:'- %s (%h, %an)' -n 200)"
            COUNT="$(git rev-list --count "$TAG" | head -n 1)"
          fi
          {
            echo "<!-- changelog:commits -->"
            echo "## Changes since ${PREV:-the beginning} ($COUNT commits)"
            echo ""
            echo "$COMMITS"
            echo ""
            echo "<!-- changelog:commits -->"
          } > changelog-section.md

          NOTES_TMP="$(mktemp)"
          if gh release view "$TAG" --json body --jq .body > existing.md 2>/dev/null; then
            if grep -q '<!-- changelog:commits -->' existing.md; then
              # Refresh our own section in place; keep any hand-written notes.
              awk '
                BEGIN { in_section = 0 }
                /<!-- changelog:commits -->/ {
                  if (in_section == 0) { while ((getline line < "changelog-section.md") > 0) print line; in_section = 1; next }
                  else { in_section = 0; next }
                }
                in_section == 0 { print }
              ' existing.md > "$NOTES_TMP"
            elif [[ -s existing.md ]]; then
              cat existing.md > "$NOTES_TMP"
              echo "" >> "$NOTES_TMP"
              cat changelog-section.md >> "$NOTES_TMP"
            else
              {
                echo "## Silver Skies & Silver Skies Pro $VERSION"
                echo ""
                cat changelog-section.md
              } > "$NOTES_TMP"
            fi
            gh release edit "$TAG" --notes-file "$NOTES_TMP" --draft=false
            gh release upload "$TAG" release-assets/* --clobber
          else
            {
              echo "## Silver Skies & Silver Skies Pro $VERSION"
              echo ""
              cat changelog-section.md
            } > "$NOTES_TMP"
            gh release create "$TAG" release-assets/* \
              --title "Silver Skies & Silver Skies Pro $VERSION" --notes-file "$NOTES_TMP" --latest
          fi
          echo "Published ${TAG} with $(ls release-assets | wc -l) assets."
