<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Globe</title>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.125.0/Build/Cesium/Cesium.js"></script>
<link href="https://cdn.jsdelivr.net/npm/cesium@1.125.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<style>
  html, body, #globe { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  #hud {
    position: absolute; left: 10px; top: 10px; z-index: 5;
    font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; color: #ffb000;
    background: rgba(0,0,0,.55); padding: 6px 9px; border-radius: 6px;
    pointer-events: none; max-width: 60%;
  }
  #legend {
    position: absolute; left: 10px; bottom: 34px; z-index: 5; display: flex; gap: 0;
    font: 10px ui-monospace, Menlo, Consolas, monospace; color: #fff;
    background: rgba(0,0,0,.55); padding: 5px 7px; border-radius: 6px; pointer-events: none;
  }
  #legend span { display: inline-block; width: 18px; height: 8px; }
  #err { position: absolute; inset: 0; display: none; place-items: center; color: #ddd;
         font: 14px system-ui, sans-serif; text-align: center; padding: 2em; }
  .cesium-viewer-bottom { opacity: .85; }
</style>
</head>
<body>
<div id="globe"></div>
<div id="hud">Loading the globe…</div>
<div id="legend"></div>
<div id="err"></div>
<script type="module">
import Pbf from 'https://cdn.jsdelivr.net/npm/pbf@4.0.1/+esm';
import { VectorTile } from 'https://cdn.jsdelivr.net/npm/@mapbox/vector-tile@2.0.3/+esm';

const log = (m) => { try { window.ipc.postMessage(String(m)); } catch (_) {} };
window.addEventListener('error', (e) => log('error ' + e.message));
window.addEventListener('unhandledrejection', (e) => log('error ' + (e.reason && e.reason.message || e.reason)));

const hud = document.getElementById('hud');
const C = window.Cesium;
if (!C) {
  const err = document.getElementById('err');
  err.style.display = 'grid';
  err.textContent = 'CesiumJS could not be loaded. The globe needs an internet connection.';
  log('error CesiumJS failed to load');
  throw new Error('no Cesium');
}

// No Cesium ion: every layer below is free and keyless.
C.Ion.defaultAccessToken = '';

// --- Imagery: Esri World Imagery, with place names on top -------------------
// Cesium's Esri provider drops Esri's "no imagery here" tiles, so the
// coarser photo shows instead of grey squares.
const imagery = await C.ArcGisMapServerImageryProvider.fromUrl(
  'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer',
  { enablePickFeatures: false },
).catch((e) => {
  log('imagery service: ' + e);
  return new C.UrlTemplateImageryProvider({
    url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    maximumLevel: 19,
    credit: new C.Credit('Imagery: Esri, Maxar, Earthstar Geographics'),
  });
});
const labels = new C.UrlTemplateImageryProvider({
  url: 'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
  maximumLevel: 19,
  credit: new C.Credit('Labels: Esri'),
});

// --- Terrain: AWS Terrain Tiles (Terrarium PNGs), decoded here --------------
const TERRARIUM = 'https://s3.amazonaws.com/elevation-tiles-prod/terrarium';
const TMAX = 15;            // deepest published level
const GRID = 65;            // heights per tile side handed to Cesium
const tcache = new Map();   // "z/x/y" -> Promise<Float32Array(256*256)>

function terrarium(z, x, y) {
  const k = `${z}/${x}/${y}`;
  let p = tcache.get(k);
  if (!p) {
    p = fetch(`${TERRARIUM}/${k}.png`)
      .then((r) => { if (!r.ok) throw new Error(r.status); return r.blob(); })
      .then((b) => createImageBitmap(b, { colorSpaceConversion: 'none', premultiplyAlpha: 'none' }))
      .then((img) => {
        const c = new OffscreenCanvas(img.width, img.height);
        const g = c.getContext('2d', { willReadFrequently: true });
        g.drawImage(img, 0, 0);
        const d = g.getImageData(0, 0, img.width, img.height).data;
        const h = new Float32Array(img.width * img.height);
        for (let i = 0; i < h.length; i++) {
          const v = d[i * 4] * 256 + d[i * 4 + 1] + d[i * 4 + 2] / 256 - 32768;
          h[i] = v > 0 ? v : 0; // sea floor reads as sea level
        }
        return h;
      });
    tcache.set(k, p);
    if (tcache.size > 600) tcache.delete(tcache.keys().next().value);
    p.catch(() => tcache.delete(k));
  }
  return p;
}

const terrain = new C.CustomHeightmapTerrainProvider({
  width: GRID,
  height: GRID,
  tilingScheme: new C.WebMercatorTilingScheme(),
  credit: new C.Credit('Terrain: AWS Terrain Tiles'),
  callback: (x, y, level) => {
    // Past the deepest level, sample the level-15 ancestor.
    const z = Math.min(level, TMAX);
    const d = level - z;
    const k = 1 << d;
    const px = x >> d, py = y >> d;
    const ox = (x - px * k) / k, oy = (y - py * k) / k;
    return terrarium(z, px, py).then((h) => {
      const out = new Float32Array(GRID * GRID);
      for (let j = 0; j < GRID; j++) {
        const fy = (oy + j / (GRID - 1) / k) * 255;
        const y0 = Math.floor(fy), y1 = Math.min(255, y0 + 1), ty = fy - y0;
        for (let i = 0; i < GRID; i++) {
          const fx = (ox + i / (GRID - 1) / k) * 255;
          const x0 = Math.floor(fx), x1 = Math.min(255, x0 + 1), tx = fx - x0;
          const a = h[y0 * 256 + x0] * (1 - tx) + h[y0 * 256 + x1] * tx;
          const b = h[y1 * 256 + x0] * (1 - tx) + h[y1 * 256 + x1] * tx;
          out[j * GRID + i] = a * (1 - ty) + b * ty;
        }
      }
      return out;
    }).catch(() => new Float32Array(GRID * GRID));
  },
});

// --- The viewer --------------------------------------------------------------
const viewer = new C.Viewer('globe', {
  baseLayer: new C.ImageryLayer(imagery),
  terrainProvider: terrain,
  baseLayerPicker: false, geocoder: false, homeButton: false, sceneModePicker: false,
  navigationHelpButton: false, animation: false, timeline: false, fullscreenButton: false,
  infoBox: false, selectionIndicator: false, shadows: true,
  msaaSamples: 4,
});
const scene = viewer.scene;
viewer.imageryLayers.addImageryProvider(labels);
scene.globe.enableLighting = true;           // the real sun for this moment
scene.globe.depthTestAgainstTerrain = true;
scene.globe.maximumScreenSpaceError = 1.5;   // sharper terrain and imagery
scene.globe.tileCacheSize = 400;
scene.globe.showGroundAtmosphere = true;
scene.skyAtmosphere.show = true;
scene.fog.enabled = true;
scene.highDynamicRange = false;
scene.postProcessStages.fxaa.enabled = true;
viewer.shadowMap.softShadows = true;
viewer.shadowMap.size = 2048;
viewer.shadowMap.maximumDistance = 6000;
viewer.clock.shouldAnimate = true;           // keep the sun moving

// --- Buildings: OpenStreetMap via OpenFreeMap vector tiles --------------------
const BLEVEL = 14;
let tileUrl = null;
const btiles = new Map(); // "x/y" -> { primitive | null, pending }

fetch('https://tiles.openfreemap.org/planet')
  .then((r) => r.json())
  .then((j) => { tileUrl = j.tiles[0]; })
  .catch((e) => log('buildings: ' + e));

function lonlatToTile(lon, lat, z) {
  const n = 2 ** z;
  const x = Math.floor((lon + 180) / 360 * n);
  const r = lat * Math.PI / 180;
  const y = Math.floor((1 - Math.asinh(Math.tan(r)) / Math.PI) / 2 * n);
  return [x, y];
}

const concrete = [
  new C.Color(0.86, 0.85, 0.82, 1), new C.Color(0.80, 0.80, 0.78, 1),
  new C.Color(0.90, 0.88, 0.84, 1), new C.Color(0.76, 0.78, 0.80, 1),
];

async function loadBuildings(x, y) {
  const key = `${x}/${y}`;
  if (btiles.has(key) || !tileUrl) return;
  btiles.set(key, { primitive: null });
  try {
    const url = tileUrl.replace('{z}', BLEVEL).replace('{x}', x).replace('{y}', y);
    const buf = await (await fetch(url)).arrayBuffer();
    const vt = new VectorTile(new Pbf(buf));
    const layer = vt.layers.building;
    if (!layer) return;
    const polys = [];
    for (let i = 0; i < layer.length; i++) {
      const f = layer.feature(i);
      if (f.type !== 3 || f.properties.hide_3d) continue;
      const gj = f.toGeoJSON(x, y, BLEVEL).geometry;
      const parts = gj.type === 'Polygon' ? [gj.coordinates] : gj.coordinates;
      const h = Number(f.properties.render_height) || 6;
      const mh = Number(f.properties.render_min_height) || 0;
      for (const rings of parts) {
        const outer = rings[0];
        if (!outer || outer.length < 4) continue;
        // Keep a building in the tile its first corner is in (tiles overlap).
        const [tx, ty] = lonlatToTile(outer[0][0], outer[0][1], BLEVEL);
        if (tx !== x || ty !== y) continue;
        let cx = 0, cy = 0;
        for (const p of outer) { cx += p[0]; cy += p[1]; }
        polys.push({ rings, h, mh, c: [cx / outer.length, cy / outer.length] });
      }
    }
    if (!polys.length) return;
    // Ground under each building (heights come from the same terrain).
    const pts = polys.map((p) => C.Cartographic.fromDegrees(p.c[0], p.c[1]));
    await C.sampleTerrainMostDetailed(terrain, pts).catch(() => {});
    const instances = [];
    polys.forEach((p, i) => {
      const ground = pts[i].height || 0;
      const toCart = (ring) => C.Cartesian3.fromDegreesArray(ring.flat());
      const hierarchy = new C.PolygonHierarchy(
        toCart(p.rings[0]),
        p.rings.slice(1).map((r) => new C.PolygonHierarchy(toCart(r))),
      );
      instances.push(new C.GeometryInstance({
        geometry: new C.PolygonGeometry({
          polygonHierarchy: hierarchy,
          height: ground + p.mh,
          extrudedHeight: ground + p.h,
          vertexFormat: C.PerInstanceColorAppearance.VERTEX_FORMAT,
        }),
        attributes: {
          color: C.ColorGeometryInstanceAttribute.fromColor(concrete[i % concrete.length]),
        },
      }));
    });
    const prim = new C.Primitive({
      geometryInstances: instances,
      appearance: new C.PerInstanceColorAppearance({ translucent: false, closed: true }),
      shadows: C.ShadowMode.ENABLED,
      asynchronous: true,
    });
    scene.primitives.add(prim);
    btiles.get(key).primitive = prim;
  } catch (e) {
    log('buildings ' + key + ': ' + e);
    btiles.delete(key);
  }
}

// Load buildings around what the camera looks at, when it's low enough.
function updateBuildings() {
  const height = scene.camera.positionCartographic.height;
  const show = height < 8000;
  for (const t of btiles.values()) if (t.primitive) t.primitive.show = show;
  if (!show) return;
  const c = scene.camera.pickEllipsoid(
    new C.Cartesian2(scene.canvas.clientWidth / 2, scene.canvas.clientHeight * 0.6));
  if (!c) return;
  const g = C.Cartographic.fromCartesian(c);
  const [x, y] = lonlatToTile(C.Math.toDegrees(g.longitude), C.Math.toDegrees(g.latitude), BLEVEL);
  const r = height < 2500 ? 1 : 2;
  for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) loadBuildings(x + dx, y + dy);
  // Forget far tiles.
  if (btiles.size > 60) {
    for (const [k, t] of btiles) {
      const [kx, ky] = k.split('/').map(Number);
      if (Math.abs(kx - x) > 4 || Math.abs(ky - y) > 4) {
        if (t.primitive) scene.primitives.remove(t.primitive);
        btiles.delete(k);
      }
    }
  }
}
scene.camera.moveEnd.addEventListener(updateBuildings);

// --- Radar: the 3D volume from Pro ----------------------------------------------
const STOPS = [
  [10, [0x40, 0x9c, 0xd8]], [20, [0x2e, 0xb8, 0x4a]], [30, [0x1f, 0x8f, 0x2a]],
  [35, [0xd8, 0xd8, 0x20]], [40, [0xf0, 0xb4, 0x00]], [45, [0xf0, 0x78, 0x00]],
  [50, [0xe8, 0x14, 0x14]], [55, [0xb0, 0x00, 0x00]], [60, [0xe0, 0x20, 0xe0]],
  [68, [0xff, 0xff, 0xff]],
];
function dbzColor(dbz) {
  let c = STOPS[0][1];
  for (let i = 0; i + 1 < STOPS.length; i++) {
    const [a, ca] = STOPS[i], [b, cb] = STOPS[i + 1];
    if (dbz >= a && dbz < b) {
      const t = (dbz - a) / (b - a);
      c = ca.map((v, k) => v + (cb[k] - v) * t);
      break;
    }
    if (dbz >= b) c = cb;
  }
  const alpha = (70 + Math.min(50, Math.max(0, dbz - 10)) * 3.6) / 255;
  return new C.Color(c[0] / 255, c[1] / 255, c[2] / 255, alpha);
}
{
  const leg = document.getElementById('legend');
  for (let d = 10; d <= 65; d += 5) {
    const s = document.createElement('span');
    s.style.background = dbzColor(d).withAlpha(1).toCssColorString();
    s.title = d + ' dBZ';
    leg.appendChild(s);
  }
  leg.insertAdjacentHTML('beforeend', '&nbsp;10–65 dBZ');
}

let radarPoints = null;
async function loadRadar() {
  const r = await (await fetch(new URL('radar.json', location.href))).json();
  if (radarPoints) { scene.primitives.remove(radarPoints); radarPoints = null; }
  if (!r || !r.v) return;
  const pts = new C.PointPrimitiveCollection({ blendOption: C.BlendOption.TRANSLUCENT });
  const kmLat = 1 / 111.19, kmLon = kmLat / Math.max(0.05, Math.cos(r.lat * Math.PI / 180));
  const px = Math.max(3, r.voxel_km * 4);
  const v = r.v;
  for (let i = 0; i + 3 < v.length; i += 4) {
    pts.add({
      position: C.Cartesian3.fromDegrees(r.lon + v[i] * kmLon, r.lat + v[i + 1] * kmLat, v[i + 2] * 1000),
      color: dbzColor(v[i + 3]),
      pixelSize: px,
      scaleByDistance: new C.NearFarScalar(1e4, 2.2, 5e5, 0.35),
    });
  }
  radarPoints = scene.primitives.add(pts);
  hud.textContent = (r.label || 'Radar') + ` · ${v.length / 4} echoes`;
  log(`radar: ${v.length / 4} echoes`);
}

// --- Messages from Pro ---------------------------------------------------------
let flown = false;
window.ss = (m) => {
  if (!m || !m.type) return;
  if (m.type === 'scene') {
    const view = {
      destination: C.Cartesian3.fromDegrees(m.lon, m.lat - 0.55, 38000),
      orientation: { heading: 0, pitch: C.Math.toRadians(-32), roll: 0 },
    };
    if (flown) scene.camera.flyTo({ ...view, duration: 2.5 });
    else scene.camera.setView(view);
    flown = true;
    updateBuildings();
    if (m.name) hud.textContent = m.name;
  } else if (m.type === 'radar') {
    loadRadar().catch((e) => log('radar: ' + e));
  } else if (m.type === 'goto') {
    scene.camera.flyTo({
      destination: C.Cartesian3.fromDegrees(m.lon, m.lat, m.height || 1500),
      orientation: { heading: 0, pitch: C.Math.toRadians(-35), roll: 0 },
    });
  }
};
log('ready');
</script>
</body>
</html>
