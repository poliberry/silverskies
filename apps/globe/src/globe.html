<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Map</title>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
  html, body, #map { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0e1320; }
  .hud {
    position: absolute; z-index: 5; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace;
    color: #ffb000; background: rgba(8,12,20,.72); border-radius: 6px; padding: 6px 9px;
  }
  #status { left: 10px; top: 10px; pointer-events: none; max-width: 55%; }
  #legend { left: 10px; bottom: 30px; color: #dfe6f0; font-size: 10px; pointer-events: none; display: flex; align-items: center; }
  #legend span { display: inline-block; width: 18px; height: 8px; }
  #style { right: 50px; top: 10px; padding: 3px; display: flex; gap: 2px; }
  #style button {
    font: 12px system-ui, sans-serif; color: #c9d3e0; background: transparent; border: 0;
    padding: 5px 12px; border-radius: 4px; cursor: pointer;
  }
  #style button.on { background: #ffb000; color: #111; }
  #err { position: absolute; inset: 0; display: none; place-items: center; color: #ddd;
         font: 14px system-ui, sans-serif; text-align: center; padding: 2em; }
</style>
</head>
<body>
<div id="map"></div>
<div id="status" class="hud">Loading the map…</div>
<div id="legend" class="hud"></div>
<div id="style" class="hud"><button data-s="map" class="on">Map</button><button data-s="satellite">Satellite</button></div>
<div id="err"></div>
<script>
(async () => {
const log = (m) => { try { window.ipc.postMessage(String(m)); } catch (_) {} };
window.addEventListener('error', (e) => log('error ' + e.message));
window.addEventListener('unhandledrejection', (e) => log('error ' + (e.reason && e.reason.message || e.reason)));
const status = document.getElementById('status');
const ML = window.maplibregl;
if (!ML) {
  const err = document.getElementById('err');
  err.style.display = 'grid';
  err.textContent = 'The map library could not be loaded. The 3D map needs an internet connection.';
  log('error MapLibre failed to load');
  return;
}

// --- Style: OpenFreeMap's dark style, recoloured toward a blue-grey streets
// look, plus terrain, satellite imagery and 3D buildings. All free, no keys.
const style = await (await fetch('https://tiles.openfreemap.org/styles/dark')).json();
const P = {
  background: '#1a2130', water: '#0e1a2e', waterway: '#13223a', park: '#1c2e2a', wood: '#1d302a',
  residential: '#1e2636', building: '#2a3346', minor: '#343f55', major: '#4b5775',
  majorCasing: '#151b27', motorway: '#9a7a45', rail: '#3a4459', label: '#aab6ca', boundary: '#5a6482',
};
const set = (l, k, v) => { l.paint = l.paint || {}; l.paint[k] = v; };
for (const l of style.layers) {
  const id = l.id;
  if (id === 'background') set(l, 'background-color', P.background);
  else if (id === 'water') set(l, 'fill-color', P.water);
  else if (id === 'waterway') set(l, 'line-color', P.waterway);
  else if (id === 'landuse_park') set(l, 'fill-color', P.park);
  else if (id === 'landcover_wood') set(l, 'fill-color', P.wood);
  else if (id === 'landuse_residential') { set(l, 'fill-color', P.residential); set(l, 'fill-opacity', 0.8); }
  else if (id === 'building') { set(l, 'fill-color', P.building); set(l, 'fill-outline-color', '#2b3447'); }
  else if (id === 'highway_minor' || id === 'highway_path') set(l, 'line-color', P.minor);
  else if (id === 'highway_major_inner' || id === 'highway_major_subtle') set(l, 'line-color', P.major);
  else if (id.endsWith('_casing')) set(l, 'line-color', P.majorCasing);
  else if (id === 'highway_motorway_inner' || id === 'highway_motorway_subtle') set(l, 'line-color', P.motorway);
  else if (id.startsWith('railway') && !id.endsWith('dashline')) set(l, 'line-color', P.rail);
  else if (id.startsWith('boundary')) set(l, 'line-color', P.boundary);
  if (l.type === 'symbol' && l.paint && 'text-color' in l.paint) {
    set(l, 'text-color', P.label);
    set(l, 'text-halo-color', 'rgba(10,14,22,0.9)');
  }
}
const terrarium = {
  type: 'raster-dem',
  tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
  encoding: 'terrarium', tileSize: 256, maxzoom: 15,
  attribution: 'Terrain: <a href="https://registry.opendata.aws/terrain-tiles/">AWS Terrain Tiles</a>',
};
style.sources.terrain = terrarium;
style.sources.hills = { ...terrarium };
style.sources.satellite = {
  type: 'raster', tileSize: 256, maxzoom: 19,
  tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
  attribution: 'Imagery: Esri, Maxar, Earthstar Geographics',
};
// Satellite under everything (hidden in map mode); hillshade above the land.
const firstAbove = style.layers.findIndex((l) => l.id === 'water');
style.layers.splice(1, 0, { id: 'satellite', type: 'raster', source: 'satellite', layout: { visibility: 'none' } });
style.layers.splice(firstAbove + 1, 0, {
  id: 'hillshade', type: 'hillshade', source: 'hills',
  paint: { 'hillshade-shadow-color': '#070b14', 'hillshade-highlight-color': '#3a4560', 'hillshade-exaggeration': 0.4 },
});
// 3D buildings: height from OpenStreetMap, lighter the taller.
const symbolsAt = style.layers.findIndex((l) => l.type === 'symbol');
style.layers.splice(symbolsAt, 0, {
  id: 'buildings-3d', type: 'fill-extrusion', source: 'openmaptiles', 'source-layer': 'building',
  minzoom: 13, filter: ['!=', ['get', 'hide_3d'], true],
  paint: {
    'fill-extrusion-color': ['interpolate', ['linear'], ['coalesce', ['get', 'render_height'], 0],
      0, '#343e54', 40, '#414c66', 150, '#56638a', 300, '#6c79a0'],
    'fill-extrusion-height': ['interpolate', ['linear'], ['zoom'], 13, 0, 14, ['coalesce', ['get', 'render_height'], 6]],
    'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], 0],
    'fill-extrusion-opacity': 0.92,
    'fill-extrusion-vertical-gradient': true,
  },
});
style.terrain = { source: 'terrain', exaggeration: 1 };
style.sky = {
  'sky-color': '#0b1830', 'horizon-color': '#24324d', 'fog-color': '#141a26',
  'sky-horizon-blend': 0.6, 'horizon-fog-blend': 0.6, 'fog-ground-blend': 0.4, 'atmosphere-blend': 0.6,
};

const map = new ML.Map({
  container: 'map', style, center: [0, 20], zoom: 2, pitch: 0, maxPitch: 85,
  attributionControl: { compact: true }, antialias: true,
});
map.addControl(new ML.NavigationControl({ visualizePitch: true }), 'top-right');

// --- Map | Satellite ------------------------------------------------------------
// Satellite: the photo on the terrain, place names, nothing else raised.
const KEEP_ON_SATELLITE = new Set(['place', 'water_name']);
let mode = 'map';
try { mode = localStorage.getItem('ss-3d-style') || 'map'; } catch (_) {}
function applyMode(m) {
  mode = m;
  try { localStorage.setItem('ss-3d-style', m); } catch (_) {}
  for (const b of document.querySelectorAll('#style button')) b.classList.toggle('on', b.dataset.s === m);
  const sat = m === 'satellite';
  for (const l of map.getStyle().layers) {
    let show;
    if (l.id === 'satellite') show = sat;
    else if (l.id === 'radar3d' || l.id === 'background') show = true;
    else if (sat) show = l.type === 'symbol' && KEEP_ON_SATELLITE.has(l['source-layer']);
    else show = true;
    map.setLayoutProperty(l.id, 'visibility', show ? 'visible' : 'none');
  }
}
for (const b of document.querySelectorAll('#style button')) b.onclick = () => applyMode(b.dataset.s);

// --- Radar: the volume from Pro, as soft points in a custom WebGL layer ---------
const STOPS = [
  [10, [0x40, 0x9c, 0xd8]], [20, [0x2e, 0xb8, 0x4a]], [30, [0x1f, 0x8f, 0x2a]],
  [35, [0xd8, 0xd8, 0x20]], [40, [0xf0, 0xb4, 0x00]], [45, [0xf0, 0x78, 0x00]],
  [50, [0xe8, 0x14, 0x14]], [55, [0xb0, 0x00, 0x00]], [60, [0xe0, 0x20, 0xe0]],
  [68, [0xff, 0xff, 0xff]],
];
function dbzRgba(dbz) {
  let c = STOPS[0][1];
  for (let i = 0; i + 1 < STOPS.length; i++) {
    const [a, ca] = STOPS[i], [b, cb] = STOPS[i + 1];
    if (dbz >= a && dbz < b) { const t = (dbz - a) / (b - a); c = ca.map((v, k) => v + (cb[k] - v) * t); break; }
    if (dbz >= b) c = cb;
  }
  return [c[0], c[1], c[2], 70 + Math.min(50, Math.max(0, dbz - 10)) * 3.6];
}
{
  const leg = document.getElementById('legend');
  for (let d = 10; d <= 65; d += 5) {
    const s = document.createElement('span');
    const [r, g, b] = dbzRgba(d);
    s.style.background = `rgb(${r},${g},${b})`;
    leg.appendChild(s);
  }
  leg.insertAdjacentHTML('beforeend', '&nbsp;10–65 dBZ');
}

const radar = {
  id: 'radar3d', type: 'custom', renderingMode: '3d',
  count: 0, voxelM: 1000, pending: null,
  onAdd(m, gl) {
    const vs = `
      attribute vec3 a_pos; attribute vec4 a_color;
      uniform mat4 u_matrix; uniform float u_size;
      varying vec4 v_color;
      void main() {
        gl_Position = u_matrix * vec4(a_pos, 1.0);
        gl_PointSize = clamp(u_size / gl_Position.w, 1.5, 96.0);
        v_color = a_color;
      }`;
    const fs = `
      precision mediump float; varying vec4 v_color;
      void main() {
        vec2 d = gl_PointCoord - 0.5;
        float r = dot(d, d) * 4.0;
        if (r > 1.0) discard;
        gl_FragColor = vec4(v_color.rgb, v_color.a * (1.0 - r * r));
      }`;
    const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); return o; };
    this.prog = gl.createProgram();
    gl.attachShader(this.prog, sh(gl.VERTEX_SHADER, vs));
    gl.attachShader(this.prog, sh(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(this.prog);
    this.aPos = gl.getAttribLocation(this.prog, 'a_pos');
    this.aColor = gl.getAttribLocation(this.prog, 'a_color');
    this.uMatrix = gl.getUniformLocation(this.prog, 'u_matrix');
    this.uSize = gl.getUniformLocation(this.prog, 'u_size');
    this.pos = gl.createBuffer();
    this.col = gl.createBuffer();
    this.gl = gl;
    if (this.pending) this.upload(this.pending);
  },
  upload(r) {
    const gl = this.gl;
    if (!gl) { this.pending = r; return; }
    this.pending = null;
    const v = r.v, n = v.length / 4;
    const pos = new Float32Array(n * 3), col = new Uint8Array(n * 4);
    const kmLat = 1 / 111.19, kmLon = kmLat / Math.max(0.05, Math.cos(r.lat * Math.PI / 180));
    for (let i = 0; i < n; i++) {
      const lng = r.lon + v[i * 4] * kmLon, lat = r.lat + v[i * 4 + 1] * kmLat;
      const mc = ML.MercatorCoordinate.fromLngLat([lng, lat], v[i * 4 + 2] * 1000);
      pos.set([mc.x, mc.y, mc.z], i * 3);
      col.set(dbzRgba(v[i * 4 + 3]), i * 4);
    }
    gl.bindBuffer(gl.ARRAY_BUFFER, this.pos);
    gl.bufferData(gl.ARRAY_BUFFER, pos, gl.STATIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.col);
    gl.bufferData(gl.ARRAY_BUFFER, col, gl.STATIC_DRAW);
    this.count = n;
    this.voxelM = (r.voxel_km || 1) * 1000;
    this.lat = r.lat;
    map.triggerRepaint();
  },
  render(gl, args) {
    if (!this.count) return;
    // MapLibre 4 passes the matrix itself; later versions an object.
    const matrix = args && args.defaultProjectionData ? args.defaultProjectionData.mainMatrix : args;
    // A voxel's size in pixels at the map centre, times its depth there.
    const tr = map.transform;
    const mpp = 40075016.7 * Math.cos((this.lat || 0) * Math.PI / 180) / (512 * Math.pow(2, map.getZoom()));
    const size = (this.voxelM / mpp) * 1.6 * (tr.cameraToCenterDistance || 800);
    gl.useProgram(this.prog);
    gl.uniformMatrix4fv(this.uMatrix, false, matrix);
    gl.uniform1f(this.uSize, size);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.pos);
    gl.enableVertexAttribArray(this.aPos);
    gl.vertexAttribPointer(this.aPos, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.col);
    gl.enableVertexAttribArray(this.aColor);
    gl.vertexAttribPointer(this.aColor, 4, gl.UNSIGNED_BYTE, true, 0, 0);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.enable(gl.DEPTH_TEST);
    gl.depthMask(false);
    gl.drawArrays(gl.POINTS, 0, this.count);
    gl.depthMask(true);
  },
};

async function loadRadar() {
  const r = await (await fetch(new URL('radar.json', location.href))).json();
  if (!r || !r.v) return;
  radar.upload(r);
  status.textContent = (r.label || 'Radar') + ` · ${r.v.length / 4} echoes`;
  log(`radar: ${r.v.length / 4} echoes`);
}

// --- Messages from Pro -------------------------------------------------------------
let loaded = false;
const queue = [];
function handle(m) {
  if (!loaded) { queue.push(m); return; }
  if (m.type === 'scene') {
    map.jumpTo({ center: [m.lon, m.lat], zoom: 10.2, pitch: 58, bearing: -15 });
    if (m.name) status.textContent = m.name;
  } else if (m.type === 'radar') {
    loadRadar().catch((e) => log('radar: ' + e));
  } else if (m.type === 'style') {
    applyMode(m.style === 'satellite' ? 'satellite' : 'map');
  } else if (m.type === 'goto') {
    map.flyTo({ center: [m.lon, m.lat], zoom: m.zoom || 15.5, pitch: 60, bearing: -20 });
  }
}
window.ss = handle;
window.__map = map;

map.on('load', () => {
  map.addLayer(radar);
  applyMode(mode);
  if (status.textContent.startsWith('Loading')) status.textContent = '3D Map';
  loaded = true;
  for (const m of queue.splice(0)) handle(m);
  log('ready');
});
map.on('error', (e) => log('map: ' + (e.error && e.error.message || e)));
})();
</script>
</body>
</html>
